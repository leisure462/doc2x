name: Doc2X 每日自动签到

on:
  schedule:
    # 每天 UTC 01:15 (北京时间上午 09:15) 自动运行
    # Doc2X 签到刷新时间为北京时间 08:00
    - cron: '15 1 * * *'
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击触发

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行 Doc2X 自动签到
        env:
          # 账号密码配置（必填，请在仓库 Settings -> Secrets and variables -> Actions 中添加）
          DOC2X_ACCOUNTS: ${{ secrets.DOC2X_ACCOUNTS }}
          # 失败时是否让整个 Action 任务变红报错（默认 false）
          FAIL_ON_ERROR: 'false'

          # 【成功通知】飞书自定义机器人 Webhook 配置
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}

          # 【失败报警】邮件通知配置（SMTP）
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python checkin.py
